name: Test push to dtinth/docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for octo-sts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Mint cross-repo write token via octo-sts
        id: octo-sts
        uses: octo-sts/action@main
        with:
          scope: dtinth/docs
          identity: deployer-docs

      - name: Checkout dtinth/docs gh-pages
        uses: actions/checkout@v6
        with:
          repository: dtinth/docs
          ref: gh-pages
          token: ${{ steps.octo-sts.outputs.token }}
          path: docs

      - name: Write hello.txt and push
        working-directory: docs
        run: |
          echo "it works" > hello.txt
          git config user.name "deployer-docs[bot]"
          git config user.email "deployer-docs@users.noreply.github.com"
          git add hello.txt
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "test: hello.txt from deployer-docs ${{ github.run_id }}"
          git push origin gh-pages
