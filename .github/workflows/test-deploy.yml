name: Test deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for octo-sts
  actions: write    # required to upload artifact

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployer repo
        uses: actions/checkout@v4

      - name: Create test artifact
        run: |
          mkdir -p ./_artifact
          cat > ./_artifact/index.html <<'EOF'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=https://github.com/dtinth/deployer-docs">
          <a href="https://github.com/dtinth/deployer-docs">github.com/dtinth/deployer-docs</a>
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: ./_artifact

      - name: Dispatch deploy via action.yml
        uses: ./
        with:
          artifact-name: docs
