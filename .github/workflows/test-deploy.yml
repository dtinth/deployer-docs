name: Test push to dtinth/docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for octo-sts
  actions: read     # required to download artifact from source repo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployer repo
        uses: actions/checkout@v4

      - name: Download artifact from thdocs
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: ./_artifact
          repository: dtinth/thdocs
          run-id: "25552688309"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-upload artifact for dispatch chain
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: ./_artifact

      - name: Dispatch deploy via action.yml
        uses: ./
        with:
          artifact-name: docs
